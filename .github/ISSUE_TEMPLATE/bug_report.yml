name: Bug report
description: Something does not work as the specs say.
labels: ["type:bug"]
body:
  - type: textarea
    id: doctor
    attributes:
      label: ohmylaya doctor --json
      description: Paste the output. It contains no secrets.
      render: json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent host and version
      placeholder: Claude Code 2.x, Codex 0.x, OpenCode 1.x, Pi 0.x
